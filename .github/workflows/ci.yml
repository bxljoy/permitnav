name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # nightly: the smoke slice notices model or provider drift
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs (a moved tag cannot change what runs);
# Dependabot proposes updates (.github/dependabot.yml).
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: permitnav
          POSTGRES_PASSWORD: permitnav
          POSTGRES_DB: permitnav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permitnav"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://permitnav:permitnav@localhost:5432/permitnav
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked --extra api
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
      # The chat UI (phase 6), with the Node the runner image ships: types and unit tests.
      # Its build runs in the Dockerfile, so "Build image" fails on a broken UI build.
      - name: Web app types and tests
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  retrieval-eval:
    name: Retrieval eval (no models)
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: permitnav
          POSTGRES_PASSWORD: permitnav
          POSTGRES_DB: permitnav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permitnav"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://permitnav:permitnav@localhost:5432/permitnav
      # The eval corpus (public source text with embeddings; evals/README.md). A new
      # snapshot means a new release, a new checksum and, if the numbers move, new minimums.
      EVAL_CORPUS_TAG: eval-corpus-2026-11-23
      EVAL_CORPUS_SHA256: 1dcaeca23c2c78b08b24a90e3d7f984e54676963be0c66a41d3d399caeecc116
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Download the eval corpus
        run: |
          curl -fsSL -o eval-corpus.txt.gz \
            "https://github.com/${{ github.repository }}/releases/download/$EVAL_CORPUS_TAG/eval-corpus.txt.gz"
          echo "$EVAL_CORPUS_SHA256  eval-corpus.txt.gz" | sha256sum -c -
      - run: uv run permitnav migrate
      - run: uv run permitnav import-eval-corpus eval-corpus.txt.gz
      - name: Retrieval eval with recorded queries (fails below the minimums)
        run: >-
          uv run permitnav eval --queries evals/queries.dev.json
          --min-r5 0.52 --min-mrr 0.35
          --must-find work-switch-in-sweden-104-en work-switch-in-sweden-104-sv
      # Questions whose answer depends on which wording applies (transitional provisions,
      # historical dates): they need the rebuilt statute history in the corpus (phase 4).
      - name: Version-dependent slice with recorded queries (fails below the minimums)
        run: >-
          uv run permitnav eval --file evals/golden.versions.jsonl
          --queries evals/queries.versions.json --min-r5 0.66 --min-mrr 0.30

  audit:
    # Known vulnerabilities in the locked dependencies (PyPI advisory database). Not a required
    # check: a new advisory can turn it red without any change here; it shows on every run.
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: pip-audit on the lock file (all extras)
        run: |
          uv export --frozen --all-extras --no-emit-project --format requirements-txt > requirements.txt
          uvx pip-audit@2.10.1 --requirement requirements.txt --disable-pip --progress-spinner off
      - name: npm audit of the web app's runtime dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  image:
    # Build the API image once; on main, push it to GHCR tagged with the commit, so the server
    # runs exactly what CI built (deploy/update.sh pulls it by digest). On pull requests it is
    # built but not pushed, so a broken Dockerfile fails the PR.
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and on main, push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/permitnav-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=min

  smoke:
    # The LLM smoke slice (evals/smoke.json) with the real answer model. Not on pull requests:
    # it needs the OpenRouter secret, which pull requests from forks never get. Its key has its
    # own credit limit.
    name: LLM smoke slice
    # Only in this repository: a fork's own pushes have no secret either.
    if: github.event_name != 'pull_request' && github.repository == 'bxljoy/permitnav'
    needs: retrieval-eval
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: permitnav
          POSTGRES_PASSWORD: permitnav
          POSTGRES_DB: permitnav
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U permitnav"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://permitnav:permitnav@localhost:5432/permitnav
      EVAL_CORPUS_TAG: eval-corpus-2026-11-23
      EVAL_CORPUS_SHA256: 1dcaeca23c2c78b08b24a90e3d7f984e54676963be0c66a41d3d399caeecc116
      ANSWER_MODEL: anthropic/claude-haiku-5.5
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Download the eval corpus
        run: |
          curl -fsSL -o eval-corpus.txt.gz \
            "https://github.com/${{ github.repository }}/releases/download/$EVAL_CORPUS_TAG/eval-corpus.txt.gz"
          echo "$EVAL_CORPUS_SHA256  eval-corpus.txt.gz" | sha256sum -c -
      - run: uv run permitnav migrate
      - run: uv run permitnav import-eval-corpus eval-corpus.txt.gz
      - name: Smoke slice (fails when more than one question fails twice)
        run: uv run permitnav smoke --queries evals/queries.dev.json
