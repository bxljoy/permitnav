# Dependency updates as pull requests, each gated by CI like any other change.
version: 2
updates:
  - package-ecosystem: uv          # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: npm         # the chat UI (web/package.json + package-lock.json)
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:                         # one PR for minor and patch updates, not one per package
        patterns: ["*"]
        update-types: [minor, patch]
    open-pull-requests-limit: 3
    ignore:
      # Major versions of the build tools, TypeScript and React are deliberate upgrades, done
      # together and tested (vite 8 needs a new major of the React plugin, for one). Security
      # updates are not affected by this and still arrive.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions   # keeps the SHA pins in ci.yml current
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker      # the python base image in the Dockerfile
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Python stays on 3.12 everywhere (.python-version, requires-python, uv.lock, the image):
      # a new Python is a deliberate upgrade of all of them together, not a base-image bump.
      # The 3.12-slim tag already picks up 3.12 patch releases on every build.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The Node image only builds the chat UI; it stays on the 22 line (an LTS the build
      # tools support) until a deliberate upgrade.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
