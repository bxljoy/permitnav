# `docker compose up` starts Postgres with pgvector and the API (phase 3). For development
# the CLI still runs natively (on a Mac, so bge-m3 can use the GPU): `docker compose up db`.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: permitnav
      POSTGRES_PASSWORD: permitnav   # local development only
      POSTGRES_DB: permitnav
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U permitnav"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    # Production runs the image CI built (deploy/update.sh sets PERMITNAV_IMAGE to its
    # digest); without it, this is the image built from this checkout.
    image: ${PERMITNAV_IMAGE:-permitnav-api}
    env_file:         # OPENROUTER_API_KEY, ANSWER_MODEL, API_TOKEN (see .env.example)
      - path: .env
        required: false   # `docker compose up db` works on a fresh clone
    environment:          # container paths, whatever the developer's .env says
      DATABASE_URL: postgresql://permitnav:permitnav@db:5432/permitnav
      RAW_DIR: /app/data/raw
      CACHE_DIR: /app/data/cache
    ports:
      - "127.0.0.1:8000:8000"   # local only; production puts a TLS proxy in front
    volumes:
      - models:/models          # bge-m3 weights, downloaded once (~2.3 GB)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
