[project]
name = "permitnav"
version = "0.0.1"
description = "Question answering over Swedish immigration rules, with cited and dated sources."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.23",
    "psycopg[binary]>=3.2",
    # Tracing (phase 3): plain OpenTelemetry, exported to Langfuse over OTLP/HTTP.
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[project.optional-dependencies]
# Self-hosted embeddings (D15). Heavy (PyTorch); install locally with `uv sync --extra embed`.
embed = [
    "sentence-transformers>=3.3",
    "torch>=2.5",  # direct, so Linux can take the CPU-only build below
]
# The HTTP API (phase 3): `uvicorn permitnav.api:app`.
api = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
permitnav = "permitnav.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx>=0.27",  # FastAPI's TestClient
]

# Linux (the container, CI) takes PyTorch's CPU-only wheels: the default Linux build bundles
# ~2.5 GB of CUDA libraries a CPU server never uses. macOS keeps the normal build (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permitnav"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # keep hand-aligned code blocks in the docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Standalone stdlib script; it moves into src/permitnav/evals in phase 1.
"scripts/validate_golden.py" = ["UP031", "E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]
