[project]
name = "permitnav"
version = "0.0.1"
description = "Question answering over Swedish immigration rules, with cited and dated sources."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
permitnav = "permitnav.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permitnav"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # keep hand-aligned code blocks in the docs

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Standalone stdlib script; it moves into src/permitnav/evals in phase 1.
"scripts/validate_golden.py" = ["UP031", "E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]
